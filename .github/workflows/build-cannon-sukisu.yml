name: build-cannon-sukisu

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Show toolchain
        run: |
          nproc; free -h; df -h /

      - name: Clone kernel source (cannon-r-oss)
        run: |
          git clone --depth 1 --branch cannon-r-oss \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel
          ls kernel/arch/arm64/configs/ | grep -i cannon

      - name: Integrate SukiSU-Ultra (builtin branch)
        working-directory: kernel
        run: |
          curl -LSs -o /tmp/setup.sh https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh
          bash /tmp/setup.sh builtin
          ls -l drivers/kernelsu

      - name: Enable KSU configs
        working-directory: kernel
        run: |
          cfg=arch/arm64/configs/cannon_user_defconfig
          ./scripts/config --file $cfg --enable KSU --enable KSU_TAMPER_SYSCALL_TABLE
          grep -q '^CONFIG_KSU=y' $cfg || echo 'CONFIG_KSU=y' >> $cfg
          grep -q '^CONFIG_KSU_TAMPER_SYSCALL_TABLE=y' $cfg || echo 'CONFIG_KSU_TAMPER_SYSCALL_TABLE=y' >> $cfg
          tail -4 $cfg

      - name: Drop -EL flag for clang
        working-directory: kernel
        run: |
          sed -i 's/^\t*AS\t*+= -EL//' arch/arm64/Makefile
          sed -i 's/^\t*LD\t*+= -EL//' arch/arm64/Makefile
          grep -n -- '-EL' arch/arm64/Makefile || echo 'no -EL left'

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc bison flex libssl-dev libelf-dev \
            python3 device-tree-compiler gcc-aarch64-linux-gnu
          # clang-r383902 needs old ncurses5/tinfo5 (removed in 22.04)
          curl -fsSL -o /tmp/libtinfo5.deb  http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.2-0ubuntu2_amd64.deb
          curl -fsSL -o /tmp/libncurses5.deb http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libncurses5_6.2-0ubuntu2_amd64.deb
          sudo dpkg -i /tmp/libtinfo5.deb /tmp/libncurses5.deb || sudo apt-get -f install -y -qq

      - name: Fetch AOSP clang r383902 (sparse)
        run: |
          git clone --depth 1 --filter=blob:none --sparse -b android11-release \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang
          cd clang && git sparse-checkout set clang-r383902 && cd ..
          CLANG_BIN="$GITHUB_WORKSPACE/clang/clang-r383902/bin"
          test -x "$CLANG_BIN/clang"
          echo "CLANG_BIN=$CLANG_BIN" >> $GITHUB_ENV
          echo "CLANG_LIB=$GITHUB_WORKSPACE/clang/clang-r383902/lib64" >> $GITHUB_ENV
          "$CLANG_BIN/clang" --version
          "$CLANG_BIN/ld.lld" --version

      - name: Configure
        working-directory: kernel
        run: |
          export PATH="$CLANG_BIN:$PATH"
          export LD_LIBRARY_PATH="$CLANG_LIB:$LD_LIBRARY_PATH"
          echo "--- which clang ---"; which clang
          echo "--- target probe ---"
          echo | clang --target=aarch64-linux-gnu -E -v - 2>&1 | grep -iE 'target|as' | head -5
          make O=out ARCH=arm64 \
            CC=clang LD=ld.lld NM=llvm-nm OBJCOPY=llvm-objcopy \
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
            cannon_user_defconfig
          grep -E '^CONFIG_KSU|^CONFIG_LTO' out/.config || true

      - name: Build kernel
        working-directory: kernel
        run: |
          export PATH="$CLANG_BIN:$PATH"
          export LD_LIBRARY_PATH="$CLANG_LIB:$LD_LIBRARY_PATH"
          make O=out ARCH=arm64 -j$(nproc) \
            CC=clang LD=ld.lld NM=llvm-nm OBJCOPY=llvm-objcopy \
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-

      - name: Collect artifacts
        run: |
          mkdir -p artifact
          cp kernel/out/arch/arm64/boot/Image.gz-dtb artifact/ 2>/dev/null || true
          cp kernel/out/arch/arm64/boot/Image.gz     artifact/ 2>/dev/null || true
          cp kernel/out/arch/arm64/boot/Image        artifact/ 2>/dev/null || true
          cp kernel/out/.config                      artifact/ 2>/dev/null || true
          ls -l artifact

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cannon-kernel
          path: artifact/*
          if-no-files-found: error
