name: build-cannon-sukisu

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Show toolchain
        run: |
          nproc; free -h; df -h /

      - name: Cache kernel source + build output
        uses: actions/cache@v4
        with:
          path: kernel
          key: kernel-cannon-v10
          restore-keys: kernel-cannon-

      - name: Cache AOSP clang r383902
        uses: actions/cache@v4
        with:
          path: clang
          key: clang-r383902-android11
          restore-keys: clang-r383902-

      - name: Clone kernel source (cannon-r-oss)
        run: |
          if [ ! -d kernel/.git ]; then
            git clone --depth 1 --branch cannon-r-oss \
              https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel
          fi
          ls kernel/arch/arm64/configs/ | grep -i cannon

      - name: Integrate SukiSU-Ultra (main branch, kprobes hook)
        working-directory: kernel
        run: |
          curl -LSs -o /tmp/setup.sh https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh
          bash /tmp/setup.sh main || bash /tmp/setup.sh main
          ls -l drivers/kernelsu
          git -C KernelSU describe --tags 2>/dev/null || true

      - name: Enable KSU configs
        working-directory: kernel
        run: |
          cfg=arch/arm64/configs/cannon_user_defconfig
          ./scripts/config --file $cfg \
            --enable KSU --enable KPROBES --enable OVERLAY_FS --disable KPM
          for c in CONFIG_KSU=y CONFIG_KPROBES=y CONFIG_OVERLAY_FS=y; do
            grep -q "^$c$" $cfg || echo "$c" >> $cfg
          done
          grep -q 'KPM is not set' $cfg || echo '# CONFIG_KPM is not set' >> $cfg
          tail -8 $cfg

      - name: Drop -EL flag for clang
        working-directory: kernel
        run: |
          sed -i 's/^\t*AS\t*+= -EL//' arch/arm64/Makefile
          sed -i 's/^\t*LD\t*+= -EL//' arch/arm64/Makefile
          grep -n -- '-EL' arch/arm64/Makefile || echo 'no -EL left'

      - name: Stub touch firmware + 4.14 compat patches
        working-directory: kernel
        run: |
          mkdir -p drivers/input/touchscreen/fts8719/include/firmware include/firmware
          echo "0x00," > drivers/input/touchscreen/fts8719/include/firmware/fw_sample.i
          echo "0x00," > include/firmware/fw_sample.i
          sed -i 's/^\(#define FTS_AUTO_UPGRADE_EN\)[[:space:]]*1/\1                    0/' \
            drivers/input/touchscreen/fts8719/focaltech_config.h

          if [ -f drivers/kernelsu/kernel_includes.h ]; then
            perl -0pi -e 's{#include <linux/static_call\.h>}{#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 10, 0)\n#include <linux/static_call.h>\n#endif}' \
              drivers/kernelsu/kernel_includes.h
          fi
          if [ -f drivers/kernelsu/supercall/dispatch.c ]; then
            perl -0pi -e 's/kvcalloc\((.*?), (.*?), GFP_KERNEL\)/kvmalloc_array($1, $2, GFP_KERNEL | __GFP_ZERO)/g' \
              drivers/kernelsu/supercall/dispatch.c
          fi
          if [ -f drivers/kernelsu/extension/kpm/kpm.c ]; then
            perl -0pi -e 's/access_ok\((.*?), ([^,)]+?)\)/access_ok(VERIFY_WRITE, $1, $2)/g' \
              drivers/kernelsu/extension/kpm/kpm.c
          fi
          # MODULE_IMPORT_NS was added in 5.4
          grep -rl 'MODULE_IMPORT_NS' drivers/kernelsu 2>/dev/null | while read -r f; do
            sed -i '/MODULE_IMPORT_NS/d' "$f"
          done
          # linux/pgtable.h only exists on 5.x
          grep -rl 'linux/pgtable.h' drivers/kernelsu 2>/dev/null | while read -r f; do
            sed -i 's|<linux/pgtable.h>|<asm/pgtable.h>|' "$f"
          done
          # syscall_fn_t is only defined for x86_64/riscv in syscall_hook.h
          if [ -f drivers/kernelsu/hook/syscall_hook.h ]; then
            perl -0pi -e 's{#include <asm/syscall\.h>}{#include <asm/syscall.h>\n\n#if defined(__aarch64__)\ntypedef unsigned long (*syscall_fn_t)(const struct pt_regs *);\n#endif}' \
              drivers/kernelsu/hook/syscall_hook.h
            grep -n -A3 'aarch64' drivers/kernelsu/hook/syscall_hook.h | head -6
          fi
          # struct proc_ops only exists since 5.6 -> use file_operations on 4.14
          grep -rl 'struct proc_ops' drivers/kernelsu 2>/dev/null | while read -r f; do
            perl -0pi -e 's/const struct proc_ops/const struct file_operations/g; s/\.proc_open/.open/g; s/\.proc_read/.read/g; s/\.proc_write/.write/g; s/\.proc_lseek/.llseek/g; s/\.proc_release/.release/g' "$f"
            echo "patched proc_ops: $f"
          done
          echo "--- patched files ---"; find drivers/kernelsu -name '*.c' -newer /tmp/setup.sh | head -5 || true

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc bison flex libssl-dev libelf-dev \
            python3 device-tree-compiler gcc-aarch64-linux-gnu
          if [ ! -f /usr/lib/x86_64-linux-gnu/libtinfo.so.5 ]; then
            curl -fsSL -o /tmp/libtinfo5.deb  http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.2-0ubuntu2_amd64.deb
            curl -fsSL -o /tmp/libncurses5.deb http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libncurses5_6.2-0ubuntu2_amd64.deb
            sudo dpkg -i /tmp/libtinfo5.deb /tmp/libncurses5.deb || sudo apt-get -f install -y -qq
          fi

      - name: Fetch AOSP clang r383902 (sparse)
        run: |
          if [ ! -x clang/clang-r383902/bin/clang ]; then
            rm -rf clang
            git clone --depth 1 --filter=blob:none --sparse -b android11-release \
              https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang
            cd clang && git sparse-checkout set clang-r383902 && cd ..
          fi
          CLANG_BIN="$GITHUB_WORKSPACE/clang/clang-r383902/bin"
          test -x "$CLANG_BIN/clang"
          echo "CLANG_BIN=$CLANG_BIN" >> $GITHUB_ENV
          echo "CLANG_LIB=$GITHUB_WORKSPACE/clang/clang-r383902/lib64" >> $GITHUB_ENV
          "$CLANG_BIN/clang" --version

      - name: Configure
        working-directory: kernel
        run: |
          export PATH="$CLANG_BIN:$PATH"
          export LD_LIBRARY_PATH="$CLANG_LIB:$LD_LIBRARY_PATH"
          make O=out ARCH=arm64 \
            CC=clang LD=ld.lld NM=llvm-nm OBJCOPY=llvm-objcopy KCFLAGS=-DKSU_COMPAT_HAS_CURRENT_SID \
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
            cannon_user_defconfig
          grep -E '^CONFIG_KSU|^CONFIG_KPROBES|^CONFIG_OVERLAY_FS' out/.config || true

      - name: Build kernel
        working-directory: kernel
        run: |
          export PATH="$CLANG_BIN:$PATH"
          export LD_LIBRARY_PATH="$CLANG_LIB:$LD_LIBRARY_PATH"
          make O=out ARCH=arm64 -j$(nproc) \
            CC=clang LD=ld.lld NM=llvm-nm OBJCOPY=llvm-objcopy KCFLAGS=-DKSU_COMPAT_HAS_CURRENT_SID \
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-

      - name: Collect artifacts
        run: |
          mkdir -p artifact
          cp kernel/out/arch/arm64/boot/Image.gz-dtb artifact/ 2>/dev/null || true
          cp kernel/out/arch/arm64/boot/Image.gz     artifact/ 2>/dev/null || true
          cp kernel/out/arch/arm64/boot/Image        artifact/ 2>/dev/null || true
          ls -l artifact

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cannon-kernel
          path: artifact/*
          if-no-files-found: error


